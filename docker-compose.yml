services:
  api:
    build: .
    container_name: industrial-data-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: industrial-data-db
    environment:
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: industrial_password
      POSTGRES_DB: industrial_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_user -d industrial_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: